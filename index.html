    <script>
      // Restore redirected path from GitHub Pages 404 trick
      (function() {
        var redirect = sessionStorage.getItem('redirect');
        if (redirect) {
          sessionStorage.removeItem('redirect');
          var base = '/AeroVerse';
          var path = redirect.startsWith(base) ? redirect.slice(base.length) : redirect;
          if (path && path !== '/') {
            window.history.replaceState(null, '', base + (path.startsWith('/') ? path : '/' + path));
          }
        }
      })();
    </script>
